name: CI (as-is, sans sécurité)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilation + tests + packaging
        run: mvn -B package

      - name: Build de l'image Docker
        run: docker build -t demo-api:${{ github.sha }} .