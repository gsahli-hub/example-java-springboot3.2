name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------- Détection de secrets (Gitleaks) : bloquant ----------
  secrets_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet, pour trouver aussi les anciens secrets
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --verbose \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --report-format json \
            --report-path /repo/gitleaks-report.json --exit-code 1
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-gitleaks
          path: gitleaks-report.json

  # ---------- SAST (Semgrep) : bloquant si sévérité ERROR ----------
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: |
          semgrep scan --config p/java --config p/owasp-top-ten \
            --severity ERROR --error --json --output semgrep-report.json
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-semgrep
          path: semgrep-report.json

  # ---------- SCA (Trivy) : bloquant si HIGH ou CRITICAL ----------
  scan_dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Préparer le cache Maven
        run: mvn -B -q dependency:resolve
      - name: Trivy (dépendances)
        run: |
          docker run --rm -v "$PWD:/work" -v "$HOME/.m2:/root/.m2" \
            aquasec/trivy:latest fs \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile /work/.trivyignore \
            --format json --output /work/trivy-sca.json /work
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-trivy-sca
          path: trivy-sca.json

  # ---------- Scan de l'image Docker (Trivy) : bloquant si HIGH ou CRITICAL corrigeable ----------
  docker_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t demo-api:ci .
      - name: Trivy (image)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /work/.trivyignore \
            --format json --output /work/trivy-image.json demo-api:ci
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-trivy-image
          path: trivy-image.json

  # ---------- DAST (OWASP ZAP) sur l'application lancée ----------
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire et lancer l'application
        run: |
          docker build -t demo-api:ci .
          docker run -d --name app -p 8081:8081 demo-api:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8081/health && break
            sleep 2
          done
          curl -f http://localhost:8081/health || (docker logs app; exit 1)
      - name: ZAP baseline
        run: |
          chmod 777 "$PWD"
          i=0
          for ep in "/hello?name=test" "/ping" "/hash?input=test"; do
            i=$((i+1))
            docker run --rm --network host -v "$PWD:/zap/wrk/:rw" \
              ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
              -t "http://localhost:8081$ep" -r "zap-report-$i.html" -I
          done
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-zap
          path: zap-report-*.html

  # ---------- Passage en production : possible seulement si tout est vert ----------
  deploy:
    needs: [secrets_scan, sast, scan_dependencies, docker_scan, dast]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tous les contrôles sont passés, déploiement autorisé."